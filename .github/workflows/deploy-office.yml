name: Deploy office test server

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: office-test-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Compile Python sources
        run: python -m compileall -q backend

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: iris
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: validation-only
          ALLOWED_ORIGINS: https://mednet-test.tail89ab07.ts.net
          SESSION_SECRET: validation-only-session-secret
          BOOTSTRAP_SUPERADMIN_PASSWORD: validation-only-password
        run: docker compose -f deploy/compose.yaml config --quiet

  deploy:
    needs: validate
    runs-on: [self-hosted, linux, x64, office, mednet]
    environment: office-testing
    steps:
      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Record immutable release SHA
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package and deploy release locally
        env:
          DEPLOY_ROOT: ${{ vars.OFFICE_DEPLOY_ROOT }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          release_dir="$DEPLOY_ROOT/releases/$RELEASE_SHA"
          release_archive="$release_dir/release.tgz"

          mkdir -p "$release_dir"
          tar \
            --exclude=.git \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=database \
            --exclude=MEDNET_API \
            -czf "$release_archive" .
          tar -xzf "$release_archive" -C "$release_dir"
          rm "$release_archive"
          chmod 700 "$release_dir/deploy/server-deploy.sh"
          "$release_dir/deploy/server-deploy.sh" "$RELEASE_SHA" "$DEPLOY_ROOT"
