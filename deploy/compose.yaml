name: mednet-face-id

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: mednet-face-id-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    shm_size: 1gb
    environment:
      APP_NAME: ${APP_NAME:-Iris Face Recognition}
      VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      START_CAMERA_SYSTEM: ${START_CAMERA_SYSTEM:-1}
      GPU_ENABLED: ${GPU_ENABLED:-false}
      GPU_DEVICE_ID: ${GPU_DEVICE_ID:--1}
      CPU_CORES: ${CPU_CORES:-6}
      MEDIA_DIR: /app/database/media
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-}
      FAISS_INDEX_PATH: /app/database/face_index.bin
      NAME_MAP_PATH: /app/database/name_map.json
      BOOTSTRAP_FACILITY_NAME: ${BOOTSTRAP_FACILITY_NAME:-Mednet}
      BOOTSTRAP_SUPERADMIN_NAME: ${BOOTSTRAP_SUPERADMIN_NAME:-Mednet Superadmin}
      BOOTSTRAP_SUPERADMIN_USERNAME: ${BOOTSTRAP_SUPERADMIN_USERNAME:-superadmin}
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${BOOTSTRAP_SUPERADMIN_PASSWORD}
      CLIENT_PUNCH_API_URL: ${CLIENT_PUNCH_API_URL:-}
      CLIENT_PUNCH_API_KEY: ${CLIENT_PUNCH_API_KEY:-}
      CLIENT_PREREG_API_URL: ${CLIENT_PREREG_API_URL:-}
      CLIENT_PREREG_API_KEY: ${CLIENT_PREREG_API_KEY:-}
    volumes:
      - face_data:/app/database
      - insightface_models:/home/iris/.insightface
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: mednet-face-id-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8083}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  face_data:
  insightface_models:
